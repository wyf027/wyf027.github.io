<footer class="editorial-footer tw-border-t tw-border-line">
    <div class="site-wrap tw-flex tw-flex-wrap tw-items-start tw-justify-between tw-gap-8 tw-py-12">
        <div><a class="wordmark" href="{{ '/' | relative_url }}">W<span class="tw-text-accent">.</span></a><p class="tw-mt-4 tw-text-sm tw-text-muted">保持好奇，持续创造。</p><p class="tw-mt-6 tw-text-xs tw-text-muted">© {{ site.time | date: '%Y' }} {{ site.name }}</p></div>
        <div class="tw-text-sm">
            <div class="tw-flex tw-flex-wrap tw-gap-6"><a href="{{ site.github_url }}" target="_blank" rel="noopener noreferrer">GitHub ↗</a><a href="mailto:{{ site.email }}">联系我 ↗</a><a href="{{ '/feed.xml' | relative_url }}">RSS ↗</a><a href="#top">返回顶部 ↑</a></div>
            <p class="tw-mt-8 tw-text-xs tw-leading-6 tw-text-muted">Powered by <a href="https://jekyllrb.com/">Jekyll</a> &amp; <a href="https://pages.github.com/">GitHub Pages</a><br>Original theme by <a href="https://github.com/leno23/Trice-Jekyll">Trice-jekyll</a></p>
        </div>
    </div>
    <!-- Third-Party JS -->
    <script type="text/javascript" src="/bower_components/geopattern/js/geopattern.min.js"></script>

    <!-- My JS -->


    {% for javascript in page.javascript %}
    <script src="/assets/js/{{javascript}}"></script>
    {% endfor %}

    {% if site.analytics.google.tracking_id %}
    <!-- Google Analytics -->
    <div style="display:none">
        <script>
            (function (i, s, o, g, r, a, m) {
                i['GoogleAnalyticsObject'] = r; i[r] = i[r] || function () {
                    (i[r].q = i[r].q || []).push(arguments)
                }, i[r].l = 1 * new Date(); a = s.createElement(o),
                    m = s.getElementsByTagName(o)[0]; a.async = 1; a.src = g; m.parentNode.insertBefore(a, m)
            })(window, document, 'script', '//www.google-analytics.com/analytics.js', 'ga');

            ga('create', '{{ site.analytics.google.tracking_id }}', 'auto');
            ga('send', 'pageview');

        </script>
    </div>
    {% endif %}

</footer>
